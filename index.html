<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>Weer · Zwolle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200;9..144,300;9..144,400;9..144,500&family=Outfit:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Outfit', system-ui, sans-serif;
    color: #ffffff;
    background: #0c1018;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ Achtergrond ============ */
  #bg {
    position: fixed;
    inset: 0;
    z-index: -3;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #0c1018;
  }

  #overlay-top, #overlay-mid, #overlay-bottom {
    position: fixed;
    left: 0; right: 0;
    z-index: -1;
    pointer-events: none;
  }
  #overlay-top    { top: 0;    height: 30vh; background: linear-gradient(180deg, rgba(8,10,18,0.62) 0%, rgba(8,10,18,0.0) 100%); }
  #overlay-mid    { top: 25vh; height: 50vh; background: radial-gradient(ellipse at center, rgba(8,10,18,0.30) 0%, rgba(8,10,18,0.0) 70%); }
  #overlay-bottom { bottom: 0; height: 60vh; background: linear-gradient(0deg, rgba(8,10,18,0.88) 0%, rgba(8,10,18,0.55) 50%, rgba(8,10,18,0.0) 100%); }

  .app {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 32px 56px 28px;
  }

  /* ================= TOP BAR ================= */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: rgba(255,255,255,0.95);
  }
  .topbar .location {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .topbar .location svg { width: 20px; height: 20px; opacity: 0.8; }
  .topbar .clock {
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
  }
  .topbar .clock .time {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: none;
    color: #fff;
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 144;
  }
  .topbar .clock .dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
  }

  /* ================= HERO ================= */
  .hero {
    align-self: center;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 60px;
    align-items: center;
  }
  .hero-main { min-width: 0; }
  .hero-eyebrow {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.78);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .hero-eyebrow .pip {
    width: 28px;
    height: 1px;
    background: rgba(255,255,255,0.55);
  }
  .hero-condition {
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 144, "SOFT" 30;
    font-size: 86px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 6px;
    color: #fff;
    text-shadow: 0 2px 30px rgba(0,0,0,0.35);
  }
  .hero-temp {
    display: flex;
    align-items: flex-start;
    line-height: 0.85;
    margin-top: -4px;
  }
  .hero-temp .num {
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 144, "SOFT" 50;
    font-size: 280px;
    font-weight: 200;
    letter-spacing: -10px;
    color: #fff;
    text-shadow: 0 6px 60px rgba(0,0,0,0.45);
  }
  .hero-temp .deg {
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 144;
    font-size: 110px;
    font-weight: 200;
    margin-top: 22px;
    margin-left: 8px;
    color: rgba(255,255,255,0.85);
    letter-spacing: -2px;
  }
  .hero-meta {
    margin-top: 12px;
    display: flex;
    gap: 32px;
    font-size: 22px;
    font-weight: 400;
    color: rgba(255,255,255,0.88);
    flex-wrap: wrap;
  }
  .hero-meta .label {
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 13px;
    font-weight: 600;
    margin-right: 8px;
  }

  /* ============ Sparkline (24u temp) ============ */
  .hero-sparkline {
    margin-top: 22px;
    max-width: 760px;
  }
  .spark-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .spark-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }
  .spark-range {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
  }
  .spark-range b { color: #fff; font-weight: 600; }
  #sparkSvg {
    width: 100%;
    height: 90px;
    display: block;
  }
  .spark-axis {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ============ 5-DAAGSE FORECAST (rechts in hero) ============ */
  .hero-forecast {
    width: 360px;
    border-left: 1px solid rgba(255,255,255,0.16);
    padding-left: 32px;
  }
  .hf-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    margin-bottom: 16px;
  }
  .hf-list { display: flex; flex-direction: column; }
  .hf-row {
    display: grid;
    grid-template-columns: 56px 32px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.10);
  }
  .hf-row:last-child { border-bottom: none; }
  .hf-day {
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 144;
    font-size: 22px;
    font-weight: 400;
    color: #fff;
  }
  .hf-icon {
    width: 28px;
    height: 28px;
    color: #fff;
  }
  .hf-icon svg { width: 100%; height: 100%; }
  .hf-prob {
    font-size: 12px;
    color: rgba(150,200,255,0.95);
    font-weight: 500;
    text-align: right;
  }
  .hf-temps {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 500;
  }
  .hf-temps .tmax { color: #fff; }
  .hf-temps .tmin { color: rgba(255,255,255,0.55); }
  .hf-bar {
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: rgba(255,255,255,0.14);
    overflow: hidden;
    position: relative;
    min-width: 70px;
  }
  .hf-bar-fill {
    position: absolute;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #6cb6ff 0%, #ffd866 60%, #ff8b6b 100%);
  }

  /* ================= BOTTOM ================= */
  .bottombar {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding-top: 20px;
  }

  .hourly {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    border-top: 1px solid rgba(255,255,255,0.18);
    border-bottom: 1px solid rgba(255,255,255,0.18);
    padding: 16px 0;
  }
  .h-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    border-right: 1px solid rgba(255,255,255,0.10);
    text-align: center;
  }
  .h-cell:last-child { border-right: none; }
  .h-time {
    font-size: 13px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
  }
  .h-cell.now .h-time { color: #fff; }
  .h-cell.now .h-time::before {
    content: "● ";
    color: #ffd866;
    font-size: 9px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .h-icon { width: 34px; height: 34px; color: #fff; }
  .h-icon svg { width: 100%; height: 100%; }
  .h-temp {
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 144;
    font-size: 24px;
    font-weight: 400;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .h-prob {
    font-size: 11px;
    font-weight: 500;
    color: rgba(150,200,255,0.95);
    letter-spacing: 0.5px;
    min-height: 14px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
  }
  .stat {
    padding: 4px 22px;
    border-right: 1px solid rgba(255,255,255,0.10);
  }
  .stat:first-child { padding-left: 0; }
  .stat:last-child  { border-right: none; padding-right: 0; }
  .stat-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat-label svg { width: 14px; height: 14px; opacity: 0.85; }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 144;
    font-size: 38px;
    font-weight: 300;
    color: #fff;
    line-height: 1;
    letter-spacing: -0.5px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .stat-value .unit {
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0;
  }
  .stat-foot {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.65);
    line-height: 1.4;
    min-height: 16px;
  }

  /* Wind specials */
  .wind-row { display: flex; align-items: baseline; gap: 8px; }
  .wind-arrow {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .wind-arrow svg { width: 100%; height: 100%; }

  /* Daylight progress */
  .daylight-bar {
    position: relative;
    height: 4px;
    background: rgba(255,255,255,0.18);
    border-radius: 999px;
    margin: 6px 0 6px;
  }
  .daylight-fill {
    position: absolute;
    height: 100%;
    background: linear-gradient(90deg, #ffd86655 0%, #ffd866 100%);
    border-radius: 999px;
  }
  .daylight-times {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.5px;
    font-weight: 500;
  }
  .daylight-value {
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 144;
    font-size: 28px;
    font-weight: 400;
    color: #fff;
    letter-spacing: -0.3px;
    line-height: 1;
  }

  /* AQ */
  .aq-row { display: flex; align-items: center; gap: 12px; }
  .aq-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #2ecc71;
    flex-shrink: 0;
    box-shadow: 0 0 0 4px rgba(46,204,113,0.18);
  }

  .error-banner {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(220,40,40,0.92);
    color: #fff;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    display: none;
    z-index: 100;
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="overlay-top"></div>
<div id="overlay-mid"></div>
<div id="overlay-bottom"></div>

<div class="app">

  <!-- ========== TOP BAR ========== -->
  <header class="topbar">
    <div class="location">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      <span id="city">Zwolle</span>
    </div>
    <div class="clock">
      <span id="dateStr">—</span>
      <span class="dot"></span>
      <span class="time" id="timeStr">—</span>
    </div>
  </header>

  <!-- ========== HERO ========== -->
  <section class="hero">
    <div class="hero-main">
      <div class="hero-eyebrow">
        <span class="pip"></span>
        <span>Huidig weer</span>
        <span class="pip"></span>
        <span id="conditionEyebrow">—</span>
      </div>
      <div class="hero-condition" id="condition">—</div>
      <div class="hero-temp">
        <span class="num" id="tempC">—</span>
        <span class="deg">°</span>
      </div>
      <div class="hero-meta">
        <div><span class="label">Voelt als</span><span id="feelsLike">—°</span></div>
        <div><span class="label">Vandaag</span><span id="todayMinMax">— · —</span></div>
        <div><span class="label">Fahrenheit</span><span id="tempF">—°F</span></div>
      </div>

      <!-- Sparkline next 24u -->
      <div class="hero-sparkline">
        <div class="spark-head">
          <div class="spark-title">Komende 24 uur</div>
          <div class="spark-range">Min <b id="spark24min">—°</b> · Max <b id="spark24max">—°</b></div>
        </div>
        <svg id="sparkSvg" viewBox="0 0 1000 90" preserveAspectRatio="none"></svg>
        <div class="spark-axis">
          <span>nu</span><span>+6u</span><span>+12u</span><span>+18u</span><span>+24u</span>
        </div>
      </div>
    </div>

    <!-- 5-daagse forecast -->
    <aside class="hero-forecast">
      <div class="hf-title">Volgende 5 dagen</div>
      <div class="hf-list" id="forecastList"></div>
    </aside>
  </section>

  <!-- ========== BOTTOM ========== -->
  <footer class="bottombar">

    <div class="hourly" id="hourly"></div>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 L8 11 a4.5 4.5 0 1 0 8 0 Z"/></svg>
          Luchtvochtigheid
        </div>
        <div class="stat-value"><span id="humidity">—</span><span class="unit">%</span></div>
        <div class="stat-foot">Dauwpunt <span id="dewpoint">—</span>°C</div>
      </div>

      <div class="stat">
        <div class="stat-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h2"/><path d="M11 12h2"/><path d="M19 12h2"/><path d="M5 18l-1 3"/><path d="M11 18l-1 3"/><path d="M17 18l-1 3"/></svg>
          Neerslag
        </div>
        <div class="stat-value"><span id="precip">—</span><span class="unit">%</span></div>
        <div class="stat-foot" id="precipNote">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>
          Wind
        </div>
        <div class="stat-value wind-row">
          <span id="windBft">—</span><span class="unit">bft</span>
          <span class="wind-arrow" id="windArrow">
            <svg viewBox="0 0 24 24"><path d="M12 4 L16 12 L12 10 L8 12 Z" fill="currentColor"/></svg>
          </span>
        </div>
        <div class="stat-foot"><span id="windDir">—</span> · vlagen <span id="windGusts">—</span> km/h</div>
      </div>

      <div class="stat">
        <div class="stat-label">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          Daglicht
        </div>
        <div class="daylight-value"><span id="daylightDuration">—</span></div>
        <div class="daylight-bar"><div class="daylight-fill" id="daylightFill" style="left:0%; width:0%;"></div></div>
        <div class="daylight-times">
          <span><span id="sunrise">—</span> ↑</span>
          <span>↓ <span id="sunset">—</span></span>
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
          Zicht
        </div>
        <div class="stat-value"><span id="visibility">—</span><span class="unit">km</span></div>
        <div class="stat-foot" id="visibilityNote">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L13.5 8.5 L20 10 L13.5 11.5 L12 18 L10.5 11.5 L4 10 L10.5 8.5 Z"/></svg>
          Luchtkwaliteit
        </div>
        <div class="aq-row">
          <span class="aq-dot" id="aqDot"></span>
          <span class="stat-value" style="font-size:30px;"><span id="aqLabel">—</span></span>
        </div>
        <div class="stat-foot">Europese AQI · <span id="aqValue">—</span></div>
      </div>

    </div>
  </footer>
</div>

<div class="error-banner" id="errorBanner"></div>

<script>
/* ===================================================================
   CONFIG
   =================================================================== */
const CONFIG = {
  latitude:  52.5168,    // Zwolle
  longitude: 6.0830,
  city: "Zwolle",
  locale: "nl-NL",
  timezone: "Europe/Amsterdam",
  refreshMinutes: 10
};

/* ===================================================================
   ACHTERGRONDFOTO'S — geverifieerde Unsplash URLs (allemaal HTTP 200)
   =================================================================== */
const BG_CANDIDATES = {
  "clear-day":    [
    "https://images.unsplash.com/photo-1601297183305-6df142704ea2?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=2400&q=85"
  ],
  "clear-night":  [
    "https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1444080748397-f442aa95c3e5?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1500674425229-f692875b0ab7?auto=format&fit=crop&w=2400&q=85"
  ],
  "cloudy-day":   [
    "https://images.unsplash.com/photo-1499346030926-9a72daac6c63?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1483381719261-6620dfa2d28a?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1505322747495-6afdd3b70760?auto=format&fit=crop&w=2400&q=85"
  ],
  "cloudy-night": [
    "https://images.unsplash.com/photo-1493514789931-586cb221d7a7?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1502209524164-acea936639a2?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1483381719261-6620dfa2d28a?auto=format&fit=crop&w=2400&q=85"
  ],
  "fog":          [
    "https://images.unsplash.com/photo-1487621167305-5d248087c724?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1543968996-ee822b8176ba?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1481627834876-b7833e8f5570?auto=format&fit=crop&w=2400&q=85"
  ],
  "rain":         [
    "https://images.unsplash.com/photo-1438449805896-28a666819a20?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1428592953211-077101b2021b?auto=format&fit=crop&w=2400&q=85",
    "https://images.unsplash.com/photo-1493314894560-5c412a56c17c?auto=format&fit=crop&w=2400&q=85"
  ],

    "https://images.unsplash.com/photo-1457269449834-928af64c684d?auto=format&fit=crop&w=2400&q=85"
  ],
  "thunder":      [
    "https://images.unsplash.com/photo-1605727216801-e27ce1d0cc28?auto=format&fit=crop&w=2400&q=85",

    "https://images.unsplash.com/photo-1500674425229-f692875b0ab7?auto=format&fit=crop&w=2400&q=85"
  ]
};

/* CSS gradient fallbacks — kicken in zodra een foto faalt */
const GRADIENTS = {
  "clear-day":    "linear-gradient(180deg, #4a90c8 0%, #87b4d4 40%, #f5c989 80%, #ec7063 100%)",
  "clear-night":  "linear-gradient(180deg, #050a1a 0%, #0d1530 40%, #1f2a48 70%, #2a3658 100%)",
  "cloudy-day":   "linear-gradient(180deg, #3e4a5c 0%, #5a6878 50%, #7e8c9c 100%)",
  "cloudy-night": "linear-gradient(180deg, #0a0e18 0%, #1c2230 50%, #303849 100%)",
  "rain":         "linear-gradient(180deg, #1a2535 0%, #2c3e50 50%, #4a6075 100%)",
  "snow":         "linear-gradient(180deg, #6a7c90 0%, #8e9eb4 50%, #b8c6d4 100%)",
  "fog":          "linear-gradient(180deg, #5a6068 0%, #7a818a 50%, #9aa1a9 100%)",
  "thunder":      "linear-gradient(180deg, #08090f 0%, #1a1d2e 50%, #2c2f47 100%)"
};

/* WMO weercode → label + bg-key + icon-key */
function wmoInfo(code, isDay) {
  const dn = isDay ? "day" : "night";
  if (code === 0)                                return { label:"Helder",            bg:`clear-${dn}`,   icon: isDay ? "sun" : "moon", short: isDay ? "Helder" : "Heldere nacht" };
  if (code === 1)                                return { label:"Vrijwel helder",    bg:`clear-${dn}`,   icon: isDay ? "sun" : "moon", short:"Vrijwel helder" };
  if (code === 2)                                return { label:"Half bewolkt",      bg:`cloudy-${dn}`,  icon: isDay ? "partly-day" : "partly-night", short:"Half bewolkt" };
  if (code === 3)                                return { label:"Bewolkt",           bg:`cloudy-${dn}`,  icon:"cloud", short:"Bewolkt" };
  if ([45,48].includes(code))                    return { label:"Mist",              bg:"fog",           icon:"fog", short:"Mistig" };
  if ([51,53,55,56,57].includes(code))           return { label:"Motregen",          bg:"rain",          icon:"drizzle", short:"Motregen" };
  if ([61,63,80,81].includes(code))              return { label:"Regen",             bg:"rain",          icon:"rain", short:"Regenachtig" };
  if ([65,82].includes(code))                    return { label:"Hevige regen",      bg:"rain",          icon:"rain", short:"Hevige regen" };
  if ([66,67].includes(code))                    return { label:"IJzel",             bg:"rain",          icon:"rain", short:"IJzel" };
  if ([71,73,75,77,85,86].includes(code))        return { label:"Sneeuw",            bg:"snow",          icon:"snow", short:"Sneeuw" };
  if ([95,96,99].includes(code))                 return { label:"Onweer",            bg:"thunder",       icon:"thunder", short:"Onweer" };
  return { label:"Onbekend", bg:`cloudy-${dn}`, icon:"cloud", short:"—" };
}

/* SVG iconen */
const ICONS = {
  sun: `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></g></svg>`,
  moon: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 13a8 8 0 0 1-10.5-10 8 8 0 1 0 10.5 10z"/></svg>`,
  cloud: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 18a4 4 0 0 0-1.18-7.82A6 6 0 0 0 6.5 9.5a4.5 4.5 0 0 0 .5 8.95L19 18z"/></svg>`,
  "partly-day": `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="8" r="3.2"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"><path d="M7 2v1.5M7 13V14M2 8h1.5M11 8h1.5M3.5 4.5l1 1M9.5 11l1 1M3.5 11.5l1-1M9.5 5l1-1"/></g><path d="M20 19a3.5 3.5 0 0 0-1-6.85A5 5 0 0 0 9 14a4 4 0 0 0 1 7.85L20 19z"/></svg>`,
  "partly-night": `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4a4 4 0 0 0 5 5 4 4 0 1 1-5-5z"/><path d="M20 19a3.5 3.5 0 0 0-1-6.85A5 5 0 0 0 9 14a4 4 0 0 0 1 7.85L20 19z"/></svg>`,
  fog: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 14a4 4 0 0 0-1.18-7.82A6 6 0 0 0 6.5 5.5a4.5 4.5 0 0 0 .5 8.95L19 14z"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M3 18h18M5 21h14"/></g></svg>`,
  drizzle: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 14a4 4 0 0 0-1.18-7.82A6 6 0 0 0 6.5 5.5a4.5 4.5 0 0 0 .5 8.95L19 14z"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M9 17l-1 2M13 17l-1 2M17 17l-1 2"/></g></svg>`,
  rain: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 14a4 4 0 0 0-1.18-7.82A6 6 0 0 0 6.5 5.5a4.5 4.5 0 0 0 .5 8.95L19 14z"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M8 17l-2 4M12 17l-2 4M16 17l-2 4"/></g></svg>`,
  snow: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 14a4 4 0 0 0-1.18-7.82A6 6 0 0 0 6.5 5.5a4.5 4.5 0 0 0 .5 8.95L19 14z"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M8 18v3M12 18v3M16 18v3M7 19.5h2M11 19.5h2M15 19.5h2"/></g></svg>`,
  thunder: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 14a4 4 0 0 0-1.18-7.82A6 6 0 0 0 6.5 5.5a4.5 4.5 0 0 0 .5 8.95L19 14z"/><path d="M12 16l-3 4h3l-1 4 4-5h-3l1-3z"/></svg>`
};

/* Helpers */
const $ = id => document.getElementById(id);
const cToF = c => Math.round(c * 9/5 + 32);
const compassDirNL = deg => {
  const dirs = ["N","NNO","NO","ONO","O","OZO","ZO","ZZO","Z","ZZW","ZW","WZW","W","WNW","NW","NNW"];
  return dirs[Math.round(((deg % 360) / 22.5)) % 16];
};
const kmhToBft = kmh => {
  const t = [1,5,11,19,28,38,49,61,74,88,102,117];
  for (let i = 0; i < t.length; i++) if (kmh < t[i]) return i;
  return 12;
};
function fmtMins(mins) {
  const h = Math.floor(mins / 60);
  const m = Math.round(mins % 60);
  return `${h}u ${m}m`;
}
function showError(msg) { const e = $("errorBanner"); e.textContent = msg; e.style.display = "block"; }
function hideError() { $("errorBanner").style.display = "none"; }

/* === Achtergrond: zet altijd direct gradient, leg foto eroverheen als die laadt === */
function setBackground(bgKey) {
  const bg = $("bg");
  const grad = GRADIENTS[bgKey] || GRADIENTS["cloudy-day"];
  // Direct gradient zetten — zo zie je altijd iets
  bg.style.background = grad;
  bg.style.backgroundSize = "cover";
  bg.style.backgroundPosition = "center";

  const list = BG_CANDIDATES[bgKey] || [];
  function tryNext(i) {
    if (i >= list.length) {
      console.warn("[weer] Alle foto's voor", bgKey, "faalden — gradient blijft staan.");
      return;
    }
    const url = list[i];
    const probe = new Image();
    probe.onload = () => {
      // Foto bovenop, gradient eronder als second layer (zichtbaar bij transparante delen)
      bg.style.background = `url("${url}") center/cover no-repeat, ${grad}`;
      console.log("[weer] Achtergrond geladen:", url);
    };
    probe.onerror = () => {
      console.warn("[weer] Foto faalde:", url);
      tryNext(i + 1);
    };
    probe.src = url;
  }
  tryNext(0);
}

/* === Open-Meteo data === */
async function fetchAll(lat, lon) {
  const wp = new URLSearchParams({
    latitude: lat, longitude: lon,
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,visibility,is_day,dew_point_2m",
    hourly: "temperature_2m,weather_code,precipitation_probability,is_day",
    daily: "sunrise,sunset,temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max",
    timezone: CONFIG.timezone,
    wind_speed_unit: "kmh",
    forecast_days: 7
  });
  const ap = new URLSearchParams({
    latitude: lat, longitude: lon,
    current: "european_aqi",
    timezone: CONFIG.timezone
  });
  const [w, a] = await Promise.all([
    fetch(`https://api.open-meteo.com/v1/forecast?${wp}`).then(r => r.json()),
    fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?${ap}`).then(r => r.json()).catch(() => null)
  ]);
  return { weather: w, air: a };
}

/* === Sparkline: 24u temperatuur === */
function renderSparkline(temps) {
  const svg = $("sparkSvg");
  const W = 1000, H = 90, PAD_X = 8, PAD_Y_TOP = 18, PAD_Y_BOTTOM = 8;
  const tMin = Math.min(...temps);
  const tMax = Math.max(...temps);
  const range = Math.max(1, tMax - tMin);

  const points = temps.map((t, i) => ({
    x: PAD_X + (i / (temps.length - 1)) * (W - 2 * PAD_X),
    y: PAD_Y_TOP + (1 - (t - tMin) / range) * (H - PAD_Y_TOP - PAD_Y_BOTTOM),
    t
  }));

  // Smooth path via cubic bezier (simple horizontal-tangent smoothing)
  let pathD = `M ${points[0].x.toFixed(1)},${points[0].y.toFixed(1)}`;
  for (let i = 1; i < points.length; i++) {
    const p0 = points[i - 1];
    const p1 = points[i];
    const cp1x = p0.x + (p1.x - p0.x) / 2;
    const cp1y = p0.y;
    const cp2x = p0.x + (p1.x - p0.x) / 2;
    const cp2y = p1.y;
    pathD += ` C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p1.x.toFixed(1)},${p1.y.toFixed(1)}`;
  }
  const last = points[points.length - 1];
  const fillD = `${pathD} L ${last.x.toFixed(1)},${H} L ${points[0].x.toFixed(1)},${H} Z`;

  // Min/max indices
  const minIdx = temps.indexOf(tMin);
  const maxIdx = temps.indexOf(tMax);

  svg.innerHTML = `
    <defs>
      <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(255,216,102,0.45)"/>
        <stop offset="100%" stop-color="rgba(255,216,102,0)"/>
      </linearGradient>
    </defs>
    <path d="${fillD}" fill="url(#sparkGrad)"/>
    <path d="${pathD}" stroke="#ffd866" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"
      vector-effect="non-scaling-stroke"/>
    <circle cx="${points[maxIdx].x.toFixed(1)}" cy="${points[maxIdx].y.toFixed(1)}" r="5" fill="#ffd866"/>
    <text x="${points[maxIdx].x.toFixed(1)}" y="${(points[maxIdx].y - 8).toFixed(1)}" text-anchor="middle"
      fill="#fff" font-size="14" font-weight="600" font-family="Outfit, sans-serif">${Math.round(tMax)}°</text>
    <circle cx="${points[minIdx].x.toFixed(1)}" cy="${points[minIdx].y.toFixed(1)}" r="5" fill="#9bd1ff"/>
    <text x="${points[minIdx].x.toFixed(1)}" y="${(points[minIdx].y + 18).toFixed(1)}" text-anchor="middle"
      fill="#9bd1ff" font-size="14" font-weight="600" font-family="Outfit, sans-serif">${Math.round(tMin)}°</text>
  `;

  $("spark24min").textContent = Math.round(tMin) + "°";
  $("spark24max").textContent = Math.round(tMax) + "°";
}

/* === 5-daagse forecast === */
function renderForecast(daily) {
  const list = $("forecastList");
  list.innerHTML = "";

  // Globale min/max over 5 dagen voor de balkjes
  const allMaxes = [], allMins = [];
  for (let i = 1; i <= 5; i++) {
    if (daily.temperature_2m_max[i] != null) allMaxes.push(daily.temperature_2m_max[i]);
    if (daily.temperature_2m_min[i] != null) allMins.push(daily.temperature_2m_min[i]);
  }
  const globMin = Math.min(...allMins);
  const globMax = Math.max(...allMaxes);
  const globRange = Math.max(1, globMax - globMin);

  for (let i = 1; i <= 5; i++) {
    if (!daily.time[i]) break;
    const dt = new Date(daily.time[i]);
    const dayName = dt.toLocaleDateString(CONFIG.locale, { weekday:"short" }).replace('.', '').toUpperCase();
    const code = daily.weather_code[i];
    const info = wmoInfo(code, true);
    const tmax = Math.round(daily.temperature_2m_max[i]);
    const tmin = Math.round(daily.temperature_2m_min[i]);
    const prob = daily.precipitation_probability_max[i] || 0;

    const left = ((tmin - globMin) / globRange) * 100;
    const right = ((tmax - globMin) / globRange) * 100;

    const row = document.createElement("div");
    row.className = "hf-row";
    row.innerHTML = `
      <div class="hf-day">${dayName}</div>
      <div class="hf-icon">${ICONS[info.icon] || ICONS.cloud}</div>
      <div class="hf-temps">
        <span class="tmin">${tmin}°</span>
        <span class="hf-bar"><span class="hf-bar-fill" style="left:${left}%; width:${Math.max(4, right - left)}%"></span></span>
        <span class="tmax">${tmax}°</span>
      </div>
      <div class="hf-prob">${prob > 0 ? prob + "%" : ""}</div>
    `;
    list.appendChild(row);
  }
}

/* === Render === */
function render(d) {
  const w = d.weather;
  const c = w.current;
  const isDay = c.is_day === 1;
  const info = wmoInfo(c.weather_code, isDay);

  $("city").textContent = CONFIG.city;
  tickClock();

  $("conditionEyebrow").textContent = info.short;
  $("condition").textContent = info.label;
  $("tempC").textContent = Math.round(c.temperature_2m);
  $("tempF").textContent = cToF(c.temperature_2m) + "°F";
  $("feelsLike").textContent = Math.round(c.apparent_temperature) + "°";

  const tmax = Math.round(w.daily.temperature_2m_max[0]);
  const tmin = Math.round(w.daily.temperature_2m_min[0]);
  $("todayMinMax").textContent = `${tmax}° / ${tmin}°`;

  setBackground(info.bg);

  /* Hourly: vanaf huidig uur, 9 uur */
  const now = new Date();
  const hourlyEl = $("hourly");
  hourlyEl.innerHTML = "";
  let baseIdx = w.hourly.time.findIndex(t => {
    const dt = new Date(t);
    return dt.getHours() === now.getHours() && dt.toDateString() === now.toDateString();
  });
  if (baseIdx === -1) baseIdx = 0;

  for (let i = 0; i < 9; i++) {
    const idx = baseIdx + i;
    if (!w.hourly.time[idx]) break;
    const dt = new Date(w.hourly.time[idx]);
    const code = w.hourly.weather_code[idx];
    const day = w.hourly.is_day[idx] === 1;
    const hi = wmoInfo(code, day);
    const isNow = i === 0;
    const label = isNow ? "NU" : dt.toLocaleTimeString(CONFIG.locale, { hour:"2-digit", minute:"2-digit" });
    const prob = w.hourly.precipitation_probability[idx];
    const cell = document.createElement("div");
    cell.className = "h-cell" + (isNow ? " now" : "");
    cell.innerHTML = `
      <div class="h-time">${label}</div>
      <div class="h-icon">${ICONS[hi.icon] || ICONS.cloud}</div>
      <div class="h-temp">${Math.round(w.hourly.temperature_2m[idx])}°</div>
      <div class="h-prob">${prob != null && prob > 0 ? prob + "%" : ""}</div>
    `;
    hourlyEl.appendChild(cell);
  }

  /* Sparkline: 24 uur vanaf nu */
  const next24 = [];
  for (let i = 0; i < 24; i++) {
    const idx = baseIdx + i;
    if (w.hourly.temperature_2m[idx] == null) break;
    next24.push(w.hourly.temperature_2m[idx]);
  }
  if (next24.length >= 4) renderSparkline(next24);

  /* 5-daagse */
  renderForecast(w.daily);

  /* Stats */
  $("humidity").textContent = Math.round(c.relative_humidity_2m);
  $("dewpoint").textContent = Math.round(c.dew_point_2m);

  const probs = w.hourly.precipitation_probability || [];
  const curProb = probs[baseIdx] != null ? Math.round(probs[baseIdx]) : 0;
  $("precip").textContent = curProb;
  if (curProb < 10)      $("precipNote").textContent = "Droog weer verwacht";
  else if (curProb < 40) $("precipNote").textContent = "Lichte kans op neerslag";
  else if (curProb < 70) $("precipNote").textContent = "Matige kans op neerslag";
  else                   $("precipNote").textContent = "Neerslag verwacht";

  $("windBft").textContent = kmhToBft(c.wind_speed_10m);
  $("windDir").textContent = compassDirNL(c.wind_direction_10m);
  $("windGusts").textContent = Math.round(c.wind_gusts_10m);
  $("windArrow").style.transform = `rotate(${(c.wind_direction_10m + 180) % 360}deg)`;

  const sr = new Date(w.daily.sunrise[0]);
  const ss = new Date(w.daily.sunset[0]);
  $("sunrise").textContent = sr.toLocaleTimeString(CONFIG.locale, { hour:"2-digit", minute:"2-digit" });
  $("sunset").textContent  = ss.toLocaleTimeString(CONFIG.locale, { hour:"2-digit", minute:"2-digit" });
  const totalMins = (ss - sr) / 60000;
  $("daylightDuration").textContent = fmtMins(totalMins);
  const pct = Math.max(0, Math.min(1, (now - sr) / (ss - sr))) * 100;
  $("daylightFill").style.width = pct + "%";

  const visKm = c.visibility / 1000;
  $("visibility").textContent = visKm >= 10 ? Math.round(visKm) : visKm.toFixed(1);
  if (visKm >= 15)      $("visibilityNote").textContent = "Perfect helder zicht";
  else if (visKm >= 10) $("visibilityNote").textContent = "Helder zicht";
  else if (visKm >= 4)  $("visibilityNote").textContent = "Goed zicht";
  else if (visKm >= 1)  $("visibilityNote").textContent = "Beperkt zicht";
  else                  $("visibilityNote").textContent = "Slecht zicht";

  if (d.air && d.air.current && d.air.current.european_aqi != null) {
    const aqi = Math.round(d.air.current.european_aqi);
    $("aqValue").textContent = aqi;
    let label, color;
    if (aqi <= 20)       { label = "Goed";            color = "#2ecc71"; }
    else if (aqi <= 40)  { label = "Redelijk";        color = "#f1c40f"; }
    else if (aqi <= 60)  { label = "Matig";           color = "#e67e22"; }
    else if (aqi <= 80)  { label = "Slecht";          color = "#e74c3c"; }
    else if (aqi <= 100) { label = "Zeer slecht";     color = "#c0392b"; }
    else                 { label = "Extreem slecht";  color = "#8e44ad"; }
    $("aqLabel").textContent = label;
    const dot = $("aqDot");
    dot.style.background = color;
    dot.style.boxShadow = `0 0 0 4px ${color}33`;
  } else {
    $("aqValue").textContent = "—";
    $("aqLabel").textContent = "n.b.";
  }
}

function tickClock() {
  const now = new Date();
  $("dateStr").textContent = now.toLocaleDateString(CONFIG.locale, { weekday:"long", day:"numeric", month:"long" });
  $("timeStr").textContent = now.toLocaleTimeString(CONFIG.locale, { hour:"2-digit", minute:"2-digit" });
}

async function update() {
  try {
    const data = await fetchAll(CONFIG.latitude, CONFIG.longitude);
    render(data);
    hideError();
  } catch (e) {
    console.error(e);
    showError("Kon weergegevens niet ophalen — opnieuw proberen…");
  }
}

update();
setInterval(update, CONFIG.refreshMinutes * 60 * 1000);
setInterval(tickClock, 30 * 1000);
</script>
